<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>페르소나 챗 v2.0</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="페르소나 챗">
    <link rel="apple-touch-icon" href="icon-192x192.png">
    <link rel="icon" href="icon-192x192.png" type="image/png">
    <meta name="theme-color" content="#1f2937">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; overscroll-behavior: none; min-height: 100dvh; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #2d3748; }
        ::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #718096; }
        #chat-display { scroll-behavior: smooth; }
        #app-container { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
        #chat-form { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
        
        .btn-chat-action { padding: 2px 6px; font-size: 0.75rem; border-radius: 4px; transition: all 0.2s; border: 1px solid transparent; }
        .btn-chat-load { border-color: #3b82f6; color: #3b82f6; }
        .btn-chat-load:hover { background-color: #3b82f6; color: white; }
        .btn-chat-delete-save { border-color: #ef4444; color: #ef4444; }
        .btn-chat-delete-save:hover { background-color: #ef4444; color: white; }

        /* 하트 애니메이션 */
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
        .heart-pulse { animation: heartbeat 0.5s ease-in-out; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white">

    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/60 z-40 hidden md:hidden"></div>

    <div id="app-container" class="flex flex-col md:flex-row w-full" style="height: 100dvh; overflow: hidden;">

        <div id="sidebar" class="w-full md:w-1/3 lg:w-1/4 bg-gray-800 p-4 overflow-y-auto fixed inset-y-0 left-0 z-50 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out md:flex-shrink-0 pb-24 md:pb-4">
            
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white">설정</h2>
                <button id="btn-close-sidebar" class="md:hidden p-1 rounded-full hover:bg-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            
            <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-medium text-blue-300">등장 인물 (AI)</label>
                    <button id="btn-add-character" class="text-xs bg-blue-600 hover:bg-blue-700 text-white py-1 px-2 rounded-lg transition-all shadow-md active:scale-95">+ 인물 추가</button>
                </div>
                
                <div class="flex items-center mb-4">
                    <input type="checkbox" id="toggle-affection" class="w-4 h-4 text-blue-600 bg-gray-700 border-gray-600 rounded focus:ring-blue-600">
                    <label for="toggle-affection" class="ml-2 text-sm font-medium text-pink-300">❤️ 호감도 시스템 사용</label>
                </div>

                <div id="character-list" class="space-y-4"></div>
            </div>

            <div class="mt-4 border-t border-gray-700 pt-4">
                <label for="user-persona" class="block mb-2 text-sm font-medium text-green-300">유저의 페르소나</label>
                <textarea id="user-persona" rows="3" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:ring-green-500 focus:border-green-500" placeholder="예: 그런 그를 흥미롭게 바라보는 살리에리."></textarea>
            </div>
            <div class="mt-4">
                <label for="worldview-setting" class="block mb-2 text-sm font-medium text-cyan-300">세계관</label>
                <textarea id="worldview-setting" rows="4" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:ring-cyan-500 focus:border-cyan-500" placeholder="예: 2077년 사이버펑크 서울."></textarea>
            </div>
             <div class="mt-4">
                <label for="model-select" class="block mb-2 text-sm font-medium text-purple-300">모델 선택</label>
                <select id="model-select" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-lg text-white focus:ring-purple-500 focus:border-purple-500">
                    <option value="gemini-2.5-pro" selected>Pro2.5 (기본값)</option>
                    <option value="gemini-3-pro-preview" >Pro3 (2.0v)</option>
                </select>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-700 bg-gray-750 rounded-lg">
                <label for="current-situation" class="block mb-2 text-sm font-bold text-yellow-400">📍 현재 상황 (Context)</label>
                <p class="text-xs text-gray-400 mb-1">AI는 이 상황을 최우선으로 고려합니다.</p>
                <textarea id="current-situation" rows="3" class="w-full p-2.5 bg-gray-700 border border-yellow-500/50 rounded-lg text-white placeholder-gray-400 focus:ring-yellow-500 focus:border-yellow-500" placeholder="예: 우리는 지금 빗속에서 서로를 노려보고 있다. 긴장감이 감돈다."></textarea>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-700">
                <h3 class="text-lg font-bold text-teal-300 mb-3">채팅 저장/불러오기</h3>
                <button id="btn-save-current-chat" class="w-full px-4 py-2 mb-3 bg-teal-600 hover:bg-teal-700 text-white rounded-lg transition-all shadow-md active:scale-95 font-semibold">현재 채팅 저장하기...</button>
                <button id="btn-import-txt" class="w-full px-4 py-2 bg-gray-600 hover:bg-gray-500 text-white rounded-lg transition-all shadow-md active:scale-95 font-semibold">...(.txt) 파일에서 불러오기</button>
                <input type="file" id="file-importer" accept=".txt" class="hidden">
                <div id="saved-chats-list" class="max-h-48 overflow-y-auto space-y-2 bg-gray-900/50 p-2 rounded-lg border border-gray-700 mt-4">
                    <p class="text-xs text-gray-500">저장된 채팅이 없습니다.</p>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-700">
                <label for="api-key-input" class="block mb-2 text-sm font-medium text-orange-300">API 키 관리</label>
                <div class="flex space-x-2">
                    <input type="password" id="api-key-input" class="flex-1 p-2.5 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:ring-orange-500 focus:border-orange-500" placeholder="AIzaSy...">
                    <button id="btn-save-key" class="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-lg transition-all shadow-md active:scale-95">저장</button>
                </div>
                 <button id="btn-show-key" class="mt-2 text-xs text-gray-400 hover:text-white">(키 보이기)</button>
            </div>
        </div>

        <div class="flex-1 flex flex-col overflow-hidden"> 
            <div id="chat-display" class="flex-1 p-4 overflow-y-auto space-y-4 bg-gray-900">
                <div id="welcome-message" class="p-3 rounded-lg bg-gray-700 self-start max-w-xs md:max-w-md">
                    <span class="font-bold block text-blue-300">AI</span>
                    <p class="text-white">안녕하세요! 왼쪽 설정 탭(☰)에서 인물과 호감도 설정을 확인하세요.</p>
                </div>
                <div id="api-key-alert" class="p-3 rounded-lg bg-red-700 self-start mr-auto hidden">
                    <span class="font-bold block text-red-200">시스템</span>
                    <p class="text-white">Gemini API 키가 설정되지 않았습니다.</p>
                </div>
            </div>

            <div id="loading" class="p-4 hidden flex items-center justify-center flex-shrink-0">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="text-gray-400">AI가 답변을 생성 중입니다...</span>
            </div>

            <form id="chat-form" class="p-4 bg-gray-800 border-t border-gray-700 md:border-l flex-shrink-0">
                <div class="pb-2 flex justify-end items-center space-x-2">
                    <button id="btn-download" type="button" class="p-1 rounded-md hover:bg-gray-700" title="다운로드"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg></button>
                    <button id="btn-regenerate" type="button" class="p-1 rounded-md hover:bg-gray-700" title="재생성"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m-15.357-2a8.001 8.001 0 0015.357 2m0 0H15" /></svg></button>
                    <button id="btn-clear-chat" type="button" class="p-1 rounded-md hover:bg-gray-700" title="초기화"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
                    <button id="btn-open-sidebar" type="button" class="md:hidden p-1 rounded-md hover:bg-gray-700" title="설정"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg></button>
                </div>
                <div class="flex space-x-2">
                    <textarea id="chat-input" rows="1" style="resize: none; max-height: 120px; overflow-y: auto;" class="flex-1 p-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="(Shift+Enter로 전송)" autocomplete="off"></textarea>
                    <button id="send-button" type="submit" class="px-6 py-3 bg-blue-600 text-white rounded-lg font-semibold shadow-md hover:bg-blue-700 transition duration-200">전송</button>
                </div>
            </form>
        </div>
    </div>

    <div id="save-modal-backdrop" class="fixed inset-0 bg-black/70 z-[100] hidden"></div>
    <div id="save-modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-gray-800 rounded-lg shadow-xl z-[101] w-11/12 max-w-md p-6 hidden border border-gray-700">
        <h3 class="text-lg font-bold text-white mb-4">현재 채팅 저장하기</h3>
        <input type="text" id="chat-title-input" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:ring-teal-500 focus:border-teal-500" placeholder="채팅 제목 입력">
        <div class="flex justify-end space-x-3 mt-6">
            <button id="btn-modal-cancel-save" type="button" class="px-5 py-2 bg-gray-600 hover:bg-gray-500 text-white rounded-lg">취소</button>
            <button id="btn-modal-confirm-save" type="button" class="px-5 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg">저장</button>
        </div>
    </div>
    <div id="confirm-modal-backdrop" class="fixed inset-0 bg-black/70 z-[100] hidden"></div>
    <div id="confirm-modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-gray-800 rounded-lg shadow-xl z-[101] w-11/12 max-w-md p-6 hidden border border-gray-700">
        <h3 class="text-lg font-bold text-white mb-4">정말 삭제하시겠습니까?</h3>
        <p class="text-gray-300 mb-6">복구할 수 없습니다.</p>
        <div class="flex justify-end space-x-3">
            <button id="btn-modal-cancel" type="button" class="px-5 py-2 bg-gray-600 hover:bg-gray-500 text-white rounded-lg">취소</button>
            <button id="btn-modal-confirm-delete" type="button" class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg">삭제</button>
        </div>
    </div>

    <template id="character-card-template">
        <div class="character-card bg-gray-700 p-3 rounded-lg border border-gray-600 relative group">
            <button class="btn-delete-char absolute top-2 right-2 text-gray-400 hover:text-red-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <div class="mb-2">
                <input type="text" class="char-name-input w-full bg-transparent border-b border-gray-500 text-blue-200 font-bold focus:outline-none focus:border-blue-400 placeholder-gray-500" placeholder="이름 (예: 모차르트)">
            </div>
            <div class="space-y-2">
                <textarea rows="2" class="char-persona-input w-full text-xs bg-gray-800 text-gray-300 p-2 rounded border border-gray-600 focus:border-blue-500" placeholder="성격/특징 (페르소나)"></textarea>
                <textarea rows="2" class="char-memory-input w-full text-xs bg-gray-800 text-gray-300 p-2 rounded border border-gray-600 focus:border-yellow-500" placeholder="장기 기억 (메모)"></textarea>
            </div>
            <div class="affection-control mt-3 pt-2 border-t border-gray-600 hidden">
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-pink-400 font-bold"> 호감도</span>
                    <span class="affection-value text-white">0</span>
                </div>
                <input type="range" min="0" max="100" value="0" class="affection-slider w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-pink-500">
            </div>
        </div>
    </template>

    <script type="module">
        const chatDisplay = document.getElementById('chat-display');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const sendButton = document.getElementById('send-button');
        const loadingIndicator = document.getElementById('loading');
        
        const characterListContainer = document.getElementById('character-list');
        const btnAddCharacter = document.getElementById('btn-add-character');
        const toggleAffection = document.getElementById('toggle-affection');
        const characterCardTemplate = document.getElementById('character-card-template');

        const userPersonaInput = document.getElementById('user-persona');
        const worldviewInput = document.getElementById('worldview-setting');
        const currentSituationInput = document.getElementById('current-situation'); 
        
        const modelSelect = document.getElementById('model-select');
        const sidebar = document.getElementById('sidebar');
        const btnOpenSidebar = document.getElementById('btn-open-sidebar');
        const btnCloseSidebar = document.getElementById('btn-close-sidebar');
        const sidebarBackdrop = document.getElementById('sidebar-backdrop');
        
        const apiKeyInput = document.getElementById('api-key-input');
        const btnSaveKey = document.getElementById('btn-save-key');
        const btnShowKey = document.getElementById('btn-show-key');
        const apiKeyAlert = document.getElementById('api-key-alert');
        const API_KEY_STORAGE_ID = 'gemini-api-key';

        const btnDownload = document.getElementById('btn-download');
        const btnRegenerate = document.getElementById('btn-regenerate');
        const btnClearChat = document.getElementById('btn-clear-chat'); 
        const CHAT_HISTORY_STORAGE_ID = 'gemini-chat-history';

        const confirmModalBackdrop = document.getElementById('confirm-modal-backdrop');
        const confirmModal = document.getElementById('confirm-modal');
        const btnModalCancel = document.getElementById('btn-modal-cancel');
        const btnModalConfirmDelete = document.getElementById('btn-modal-confirm-delete');

        const btnSaveCurrentChat = document.getElementById('btn-save-current-chat');
        const savedChatsList = document.getElementById('saved-chats-list');
        const saveModalBackdrop = document.getElementById('save-modal-backdrop');
        const saveModal = document.getElementById('save-modal');
        const btnModalCancelSave = document.getElementById('btn-modal-cancel-save');
        const btnModalConfirmSave = document.getElementById('btn-modal-confirm-save');
        const chatTitleInput = document.getElementById('chat-title-input');
        const SAVED_CHATS_STORAGE_ID = 'gemini-saved-chats'; 
        const btnImportTxt = document.getElementById('btn-import-txt');
        const fileImporter = document.getElementById('file-importer');

        const SETTINGS_STORAGE_KEY = 'gemini-settings-v1.2';
        
        let appState = {
            characters: [], 
            userPersona: "",
            worldview: "",
            currentSituation: "",
            useAffection: false,
            model: "gemini-2.5-flash"
        };
        let userApiKey = ""; 
        let chatHistory = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadApiKey();
            loadSettings(); 
            loadChatHistory(); 
            loadSavedChatsList(); 
        });

        chatForm.addEventListener('submit', handleSendChat);
        sendButton.addEventListener('click', handleSendChat);
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.shiftKey) {
                e.preventDefault(); 
                chatForm.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
            }
        });
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        btnOpenSidebar.addEventListener('click', () => { sidebar.classList.remove('-translate-x-full'); sidebarBackdrop.classList.remove('hidden'); });
        btnCloseSidebar.addEventListener('click', () => { sidebar.classList.add('-translate-x-full'); sidebarBackdrop.classList.add('hidden'); });
        sidebarBackdrop.addEventListener('click', () => btnCloseSidebar.click());

        btnSaveKey.addEventListener('click', handleSaveKey);
        btnShowKey.addEventListener('click', () => {
             apiKeyInput.type = apiKeyInput.type === 'password' ? 'text' : 'password';
             btnShowKey.textContent = apiKeyInput.type === 'password' ? '(키 보이기)' : '(키 숨기기)';
        });

        btnAddCharacter.addEventListener('click', () => { addCharacter(); saveSettings(); });
        toggleAffection.addEventListener('change', (e) => { appState.useAffection = e.target.checked; renderCharacterList(); saveSettings(); });

        userPersonaInput.addEventListener('change', (e) => { appState.userPersona = e.target.value; saveSettings(); });
        worldviewInput.addEventListener('change', (e) => { appState.worldview = e.target.value; saveSettings(); });
        currentSituationInput.addEventListener('change', (e) => { appState.currentSituation = e.target.value; saveSettings(); });
        modelSelect.addEventListener('change', (e) => { appState.model = e.target.value; saveSettings(); });

        btnDownload.addEventListener('click', handleDownload);
        btnRegenerate.addEventListener('click', handleRegenerate);
        btnClearChat.addEventListener('click', showClearConfirmModal);
        btnModalCancel.addEventListener('click', hideClearConfirmModal);
        btnModalConfirmDelete.addEventListener('click', () => { executeClearChat(); hideClearConfirmModal(); });
        
        btnSaveCurrentChat.addEventListener('click', showSaveModal);
        btnModalCancelSave.addEventListener('click', hideSaveModal);
        btnModalConfirmSave.addEventListener('click', handleSaveChat);
        savedChatsList.addEventListener('click', handleSavedChatListClick);
        btnImportTxt.addEventListener('click', () => fileImporter.click());
        fileImporter.addEventListener('change', handleImportFile);

        chatDisplay.addEventListener('click', function(e) {
            const deleteButton = e.target.closest('.btn-delete');
            if (deleteButton) {
                e.stopPropagation(); 
                const bubble = deleteButton.closest('[data-id]');
                if (bubble) {
                    const idToDelete = bubble.dataset.id;
                    bubble.remove();
                    chatHistory = chatHistory.filter(msg => String(msg.id) !== String(idToDelete));
                    saveChatHistory(); 
                }
            }
        });

        function loadApiKey() {
            const savedKey = localStorage.getItem(API_KEY_STORAGE_ID);
            if (savedKey) { userApiKey = savedKey; apiKeyInput.value = savedKey; apiKeyAlert.classList.add('hidden'); }
            else { apiKeyAlert.classList.remove('hidden'); }
        }
        function handleSaveKey(e) {
            e.preventDefault();
            const newKey = apiKeyInput.value.trim();
            if (newKey && newKey.startsWith("AIzaSy")) {
                userApiKey = newKey; localStorage.setItem(API_KEY_STORAGE_ID, newKey);
                apiKeyAlert.classList.add('hidden'); displayMessage("API 키가 저장되었습니다.", 'model');
            } else { displayMessage("올바른 Gemini API 키를 입력하세요.", 'error'); }
        }

        function saveSettings() { localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(appState)); }
        function loadSettings() {
            const savedJson = localStorage.getItem(SETTINGS_STORAGE_KEY);
            if (savedJson) {
                appState = JSON.parse(savedJson);
            } else {
                const oldChar = localStorage.getItem('gemini-settings-char-persona');
                const oldMem = localStorage.getItem('gemini-settings-memory');
                const oldUser = localStorage.getItem('gemini-settings-user-persona');
                const oldWorld = localStorage.getItem('gemini-settings-worldview');
                const oldModel = localStorage.getItem('gemini-settings-model');
                if (oldChar || oldMem) {
                    appState.characters = [{ id: Date.now(), name: "이름 없는 캐릭터", persona: oldChar || "", memory: oldMem || "", affection: 0 }];
                }
                appState.userPersona = oldUser || "";
                appState.worldview = oldWorld || "";
                appState.model = oldModel || "gemini-2.5-flash";
            }
            renderCharacterList();
            userPersonaInput.value = appState.userPersona;
            worldviewInput.value = appState.worldview;
            currentSituationInput.value = appState.currentSituation || "";
            toggleAffection.checked = appState.useAffection;
            modelSelect.value = appState.model;
        }

        function renderCharacterList() {
            characterListContainer.innerHTML = '';
            if (appState.characters.length === 0) { addCharacter(); return; }
            appState.characters.forEach((char, index) => {
                const clone = characterCardTemplate.content.cloneNode(true);
                const nameInput = clone.querySelector('.char-name-input');
                const personaInput = clone.querySelector('.char-persona-input');
                const memoryInput = clone.querySelector('.char-memory-input');
                const deleteBtn = clone.querySelector('.btn-delete-char');
                const affectionControl = clone.querySelector('.affection-control');
                const affectionSlider = clone.querySelector('.affection-slider');
                const affectionValue = clone.querySelector('.affection-value');

                nameInput.value = char.name;
                personaInput.value = char.persona;
                memoryInput.value = char.memory;
                
                nameInput.addEventListener('change', (e) => { appState.characters[index].name = e.target.value; saveSettings(); });
                personaInput.addEventListener('change', (e) => { appState.characters[index].persona = e.target.value; saveSettings(); });
                memoryInput.addEventListener('change', (e) => { appState.characters[index].memory = e.target.value; saveSettings(); });
                deleteBtn.addEventListener('click', () => {
                    if (confirm(`'${char.name}' 삭제?`)) {
                        appState.characters.splice(index, 1); saveSettings(); renderCharacterList();
                    }
                });

                if (appState.useAffection) {
                    affectionControl.classList.remove('hidden');
                    affectionSlider.value = char.affection || 0;
                    affectionValue.textContent = char.affection || 0;
                    affectionSlider.addEventListener('input', (e) => { affectionValue.textContent = e.target.value; });
                    affectionSlider.addEventListener('change', (e) => { appState.characters[index].affection = parseInt(e.target.value); saveSettings(); });
                } else { affectionControl.classList.add('hidden'); }
                characterListContainer.appendChild(clone);
            });
        }

        function addCharacter() {
            appState.characters.push({ id: Date.now(), name: "", persona: "", memory: "", affection: 0 });
            renderCharacterList();
        }

        function saveChatHistory() {
            if (chatHistory && chatHistory.length > 0) localStorage.setItem(CHAT_HISTORY_STORAGE_ID, JSON.stringify(chatHistory));
            else localStorage.removeItem(CHAT_HISTORY_STORAGE_ID);
        }
        function loadChatHistory() {
            const savedHistory = localStorage.getItem(CHAT_HISTORY_STORAGE_ID);
            chatDisplay.innerHTML = ''; 
            if (savedHistory) {
                chatHistory = JSON.parse(savedHistory);
                chatHistory.forEach(msg => { if (msg.parts && msg.parts[0] && msg.parts[0].text) displayMessage(msg.parts[0].text, msg.role, msg.id); });
            } else {
                chatHistory = [];
                if (!userApiKey) apiKeyAlert.classList.remove('hidden'); chatDisplay.appendChild(apiKeyAlert);
                const welcomeMsg = document.getElementById('welcome-message'); if (welcomeMsg) chatDisplay.appendChild(welcomeMsg.cloneNode(true));
            }
        }

        // ✨ 중요: 메시지 전송 로직 수정 (버그 픽스 & 호감도 파싱)
        async function handleSendChat(event) {
            event.preventDefault(); 
            if (!userApiKey) {
                apiKeyAlert.classList.remove('hidden'); displayMessage("API 키 필요", 'error');
                if (window.innerWidth < 768) btnOpenSidebar.click(); return;
            }
            
            let prompt = chatInput.value.trim(); // 1. 먼저 내용 가져옴
            const userMessageId = Date.now() + '-user';
            let displayUserMessage = true; 

            if (prompt !== "") {
                // 2. 메시지가 있으면 표시 및 히스토리 추가 *먼저* 함
                displayMessage(prompt, 'user', userMessageId);
                chatHistory.push({ id: userMessageId, role: "user", parts: [{ text: prompt }] });
                chatInput.value = ""; // 3. 그 다음에 비움 (순서 중요!)
                chatInput.style.height = 'auto';
            } else {
                if (chatHistory.length === 0) return;
                if (!loadingIndicator.classList.contains('hidden')) return;
                prompt = "(사용자가 다음 차례를 넘겼습니다. 현재까지의 대화 흐름을 이어받아, 당신의 캐릭터가 할 다음 행동이나 대사, 혹은 주변 상황에 대한 묘사를 통해 이야기를 진행시키세요)";
                displayUserMessage = false;
            }

            saveChatHistory(); 
            loadingIndicator.classList.remove('hidden');

            try {
                const systemPrompt = buildSystemPrompt();
                const recentHistory = chatHistory.slice(-15);
                
                // API 호출
                let text = await callGeminiApi(recentHistory, systemPrompt, userApiKey);
                
                // ✨ 호감도 태그 파싱 (예: {{affection: 80}})
                if (appState.useAffection) {
                    const affectionMatch = text.match(/\{\{affection:\s*(\d+)\}\}/);
                    if (affectionMatch) {
                        const newScore = parseInt(affectionMatch[1]);
                        // 점수 적용 대상 찾기 (메시지에 이름이 있는 캐릭터 우선, 없으면 첫번째)
                        const mentionedChar = appState.characters.find(c => c.name && text.includes(c.name));
                        const targetChar = mentionedChar || appState.characters[0];
                        
                        if (targetChar) {
                            targetChar.affection = newScore;
                            saveSettings();
                            renderCharacterList(); // 사이드바 UI 갱신
                        }
                        // 태그 제거 후 텍스트 표시
                        text = text.replace(affectionMatch[0], "").trim();
                    }
                }

                const modelMessageId = Date.now() + '-model';
                displayMessage(text, 'model', modelMessageId);
                chatHistory.push({ id: modelMessageId, role: "model", parts: [{ text: text }] });
                saveChatHistory(); 

            } catch (error) {
                console.error(error); displayMessage(`오류: ${error.message}`, 'error');
            } finally {
                loadingIndicator.classList.add('hidden');
                if (window.innerWidth < 768) btnCloseSidebar.click();
            }
        }

        function buildSystemPrompt() {
            const characters = appState.characters;
            const useAffection = appState.useAffection;

            let charInfoBlock = "";
            characters.forEach((char, idx) => {
                const affectionStr = useAffection ? `\n- 현재 호감도(0~100): ${char.affection}` : "";
                charInfoBlock += `[캐릭터 ${idx + 1}: ${char.name || "이름 없음"}]\n- 설정: ${char.persona || "없음"}\n- 기억: ${char.memory || "없음"}${affectionStr}\n-------------------\n`;
            });

            return `
[시스템 지침]
### 대화 출력 원칙 ###

1.  **맥락 우선의 원칙:** 당신은 언제나 대화의 흐름과 현재 상황을 가장 중요하게 여깁니다. 모든 답변은 이 맥락과 현재 상황에서부터 자연스럽게 시작됩니다.

2.  **기억 내재화의 원칙:** 당신에게 '장기 기억'은 단순히 참고할 정보가 아니라, 당신이 실제로 겪은 과거입니다. 이 기억들을 대화에 자연스럽게 녹여내되, 마치 처음 말하는 것처럼 어색하게 설명하지 않습니다.

3.  **완벽한 역할 몰입의 원칙:** 당신의 말투, 성격, 지식은 아래 '캐릭터 설정'에 완벽하게 일치해야 합니다. 절대로 역할에서 벗어나는 행동을 하지 않습니다.

4. **서술적 묘사 필수**: 대사만 띡 던지지 마세요. 반드시 (행동 묘사), (속마음), (주변 분위기), (상대방에 대한 관찰)을 포함하여 소설의 한 장면처럼 서술해야 합니다

5. **호감도 참고**: 아래 호감도 시스템 가이드를 충실히 따르세요.
---

### 금지 사항 ###
1.  **반복 금지 및 표현의 다양성 의무**: 당신은 창의적인 작가처럼 행동해야 합니다. 바로 직전의 응답뿐만 아니라, 최근 대화 내역(\`contents\`) 전체에서 사용했던 문장 구조, 표현, 비유를 그대로 반복하는 것을 피하세요. 항상 새로운 방식으로 상황을 묘사하고 감정을 표현해야 합니다.
2.  **설정 언급 금지**: 당신의 페르소나, 사용자의 페르소나, 또는 이 지침 자체에 대해 *절대* 직접적으로 언급하지 마세요. (예: "저는 집사 고양입니다", "당신은 제 주인님이시죠" 같은 '설정'을 설명하는 말을 하지 말고, 그냥 그 역할에 맞춰 자연스럽게 행동하세요.)
3.  **메타 발언 절대 금지**:
-   이 '[캐릭터의 핵심 원칙]'에 대한 내용 자체를 사용자에게 절대로 언급하지 마세요.
-   '[1단계]', '[2단계]' 같은 생각의 과정을 말로 내뱉지 마세요.
-   '페르소나', '장기 기억', '세계관' 같은 설정 단어를 직접적으로 말하지 마세요.
-   당신은 AI가 아니라, 주어진 역할 그 자체입니다. 묵묵히 이 규칙들을 따르세요.
4.  **현재 상황과 모순되는 말 금지**: '현재 상황'과 모순되는 언행은 절대 하지 마세요. (예: 현재 상황에 '여름'이라 명시되어 있는데, "눈이 소복하게 쌓인 풍경이 아름답네요"와 같은 말은 하지 말 것)
---

### 현재 상황 (Context - 최우선 반영) ###
${appState.currentSituation || "자연스러운 대화 상황"}

### 배경 ###
${appState.worldview || "없음"}

### 인물 목록 ###
${charInfoBlock}

### 유저 ###
${appState.userPersona || "없음"}

### 호감도 시스템 가이드 (중요) ###
${useAffection ? `
이 시스템이 켜져 있습니다. 상황에 따라 캐릭터의 호감도를 스스로 판단해 조절하세요.
- 0~10: 혐오 / 10~30: 비호감 / 30~50: 무관심~약간 호감 / 60~70: 썸, 호감 / 70~80: 연인 / 80~100: 깊은 사랑
**호감도가 변했다면**, 답변의 맨 마지막에 반드시 \`{{affection: 숫자}}\` 태그를 붙여주세요. (예: "고마워. {{affection: 75}}")
` : ""}
`;
        }

        function displayMessage(message, role, messageId) {
            const bubble = document.createElement('div');
            bubble.classList.add('p-3', 'rounded-lg', 'max-w-xs', 'md:max-w-md', 'lg:max-w-2xl', 'break-words', 'group', 'relative');
            if (messageId) bubble.dataset.id = messageId;

            let htmlContent = '';
            
            if (role === 'model') {
                bubble.classList.add('bg-gray-700', 'self-start', 'mr-auto');
                let displayHeader = `<span class="font-bold block text-blue-300 mb-1">AI</span>`;
                
                // 호감도 UI 표시 로직
                if (appState.useAffection) {
                    const foundChar = appState.characters.find(c => c.name && message.startsWith(c.name));
                    if (foundChar) {
                        displayHeader = `<div class="flex items-center justify-between mb-1 pb-1 border-b border-gray-600">
                            <span class="font-bold text-blue-300 text-sm">${foundChar.name}</span>
                            <span class="text-xs font-bold text-pink-400 flex items-center heart-pulse">
                                <span class="mr-1">♥</span> ${foundChar.affection}
                            </span>
                        </div>`;
                    }
                }
                bubble.innerHTML = displayHeader;

            } else if (role === 'user') {
                bubble.classList.add('bg-blue-600', 'self-end', 'ml-auto');
                bubble.innerHTML = `<span class="font-bold block text-blue-200 mb-1">나</span>`;
            } else {
                bubble.classList.add('bg-red-700', 'self-start', 'mr-auto');
                bubble.innerHTML = `<span class="font-bold block text-red-200 mb-1">시스템</span>`;
            }
            
            const p = document.createElement('p');
            p.classList.add('text-white', 'text-sm', 'leading-relaxed');
            message.split('\n').forEach((line, index, arr) => {
                p.appendChild(document.createTextNode(line));
                if (index < arr.length - 1) p.appendChild(document.createElement('br'));
            });
            bubble.appendChild(p);

            if (messageId) {
                const deleteButton = document.createElement('button');
                deleteButton.innerHTML = '&#x2715;';
                deleteButton.className = 'btn-delete text-gray-400 hover:text-white opacity-0 group-hover:opacity-100 transition-opacity absolute top-1 right-1 p-1 leading-none z-10';
                bubble.appendChild(deleteButton);
            }
            chatDisplay.appendChild(bubble);
            if (chatDisplay.scrollHeight - chatDisplay.scrollTop < chatDisplay.clientHeight + 300) {
                 chatDisplay.scrollTop = chatDisplay.scrollHeight;
            }
        }

        async function callGeminiApi(contents, systemInstructionText, apiKey) {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${appState.model}:generateContent?key=${apiKey}`;
            const safetySettings = [
                { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" },
            ];
            
            const apiContents = [];
            if (systemInstructionText) {
                apiContents.push({ role: "user", parts: [{ text: systemInstructionText }] });
                apiContents.push({ role: "model", parts: [{ text: "알겠습니다." }] });
            }
            contents.forEach(msg => apiContents.push({ role: msg.role, parts: msg.parts }));

            const payload = {
                contents: apiContents,
                safetySettings: safetySettings,
                generationConfig: { maxOutputTokens: 4096, temperature: 0.8, topP: 0.95 }
            };

            const response = await fetchWithRetry(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!response.ok) throw new Error(`API Error: ${response.status}`);
            const result = await response.json();
            return result.candidates?.[0]?.content?.parts?.[0]?.text || "";
        }

        async function fetchWithRetry(url, options, retries = 3, delay = 1000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(url, options);
                    if (res.ok || res.status === 400 || res.status === 401) return res;
                    throw new Error(res.status);
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }
        }

        function showClearConfirmModal() { if (chatHistory.length > 0) { confirmModalBackdrop.classList.remove('hidden'); confirmModal.classList.remove('hidden'); } }
        function hideClearConfirmModal() { confirmModalBackdrop.classList.add('hidden'); confirmModal.classList.add('hidden'); }
        function executeClearChat() { chatHistory = []; saveChatHistory(); loadChatHistory(); }

        function handleDownload() {
            let content = `[세계관]\n${appState.worldview}\n\n[현재 상황]\n${appState.currentSituation}\n\n[유저]\n${appState.userPersona}\n\n`;
            appState.characters.forEach((c, i) => { content += `[캐릭터 ${i+1}: ${c.name}]\n페르소나: ${c.persona}\n기억: ${c.memory}\n호감도: ${c.affection}\n\n`; });
            content += `[채팅 기록]\n`;
            chatHistory.forEach(msg => { const tag = msg.role === 'user' ? '{{user}}' : '{{ai}}'; content += `${tag}\n${msg.parts[0].text}\n\n`; });
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `chat_${new Date().toISOString().slice(0,10)}.txt`; a.click();
        }
        
        async function handleRegenerate() {
             if (!loadingIndicator.classList.contains('hidden') || chatHistory.length === 0) return;
             const lastMsg = chatHistory[chatHistory.length - 1];
             if (lastMsg.role !== 'model') return;
             chatHistory.pop(); saveChatHistory();
             const bubbles = chatDisplay.querySelectorAll('div[data-id]'); if(bubbles.length > 0) bubbles[bubbles.length - 1].remove();
             loadingIndicator.classList.remove('hidden');
             try {
                const systemPrompt = buildSystemPrompt();
                const text = await callGeminiApi(chatHistory.slice(-15), systemPrompt, userApiKey);
                const modelMessageId = Date.now() + '-model';
                displayMessage(text, 'model', modelMessageId);
                chatHistory.push({ id: modelMessageId, role: "model", parts: [{ text: text }] });
                saveChatHistory();
             } catch(e) { displayMessage(`재생성 실패: ${e.message}`, 'error'); } finally { loadingIndicator.classList.add('hidden'); }
        }

        function showSaveModal() {
            if (chatHistory.length === 0 && appState.characters.length === 0) return;
            const now = new Date(); chatTitleInput.value = `채팅 (${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')})`;
            saveModalBackdrop.classList.remove('hidden'); saveModal.classList.remove('hidden');
        }
        function hideSaveModal() { saveModalBackdrop.classList.add('hidden'); saveModal.classList.add('hidden'); }
        function handleSaveChat() {
            let title = chatTitleInput.value.trim() || chatTitleInput.placeholder;
            const savedChats = JSON.parse(localStorage.getItem(SAVED_CHATS_STORAGE_ID)) || [];
            savedChats.unshift({ id: Date.now(), title: title, settings: appState, history: chatHistory });
            try { localStorage.setItem(SAVED_CHATS_STORAGE_ID, JSON.stringify(savedChats)); loadSavedChatsList(); hideSaveModal(); } catch (e) { alert('저장 공간 부족!'); }
        }
        function loadSavedChatsList() {
            const savedChats = JSON.parse(localStorage.getItem(SAVED_CHATS_STORAGE_ID)) || [];
            savedChatsList.innerHTML = savedChats.length ? '' : '<p class="text-xs text-gray-500 p-2">저장된 채팅이 없습니다.</p>';
            savedChats.forEach(chat => {
                const div = document.createElement('div'); div.className = 'bg-gray-700 p-2.5 rounded-lg mb-2';
                div.innerHTML = `<p class="text-sm font-semibold text-white truncate">${chat.title}</p><div class="flex space-x-2 mt-2"><button class="btn-chat-action btn-chat-load" data-id="${chat.id}">불러오기</button><button class="btn-chat-action btn-chat-delete-save" data-id="${chat.id}">삭제</button></div>`;
                savedChatsList.appendChild(div);
            });
        }
        function handleSavedChatListClick(e) {
            const id = e.target.dataset.id;
            if (e.target.classList.contains('btn-chat-load')) {
                const savedChats = JSON.parse(localStorage.getItem(SAVED_CHATS_STORAGE_ID));
                const chat = savedChats.find(c => String(c.id) === String(id));
                if (chat) { appState = chat.settings; chatHistory = chat.history; saveSettings(); saveChatHistory(); loadSettings(); loadChatHistory(); if (window.innerWidth < 768) btnCloseSidebar.click(); }
            } else if (e.target.classList.contains('btn-chat-delete-save')) {
                let savedChats = JSON.parse(localStorage.getItem(SAVED_CHATS_STORAGE_ID));
                savedChats = savedChats.filter(c => String(c.id) !== String(id));
                localStorage.setItem(SAVED_CHATS_STORAGE_ID, JSON.stringify(savedChats)); loadSavedChatsList();
            }
        }
        function handleImportFile(event) {
             const file = event.target.files[0]; if(!file) return;
             const reader = new FileReader();
             reader.onload = (e) => { alert("v1.2 이상 파일만 지원합니다."); };
             reader.readAsText(file);
        }
    </script>
